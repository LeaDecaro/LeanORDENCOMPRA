<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orden de Compra | Neuquén</title>

    <link rel="stylesheet" href="style.css">

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js">
    </script>
</head>

<body>

<div class="app">

    <header class="encabezado-app">
        <h1>ORDEN DE COMPRA</h1>
        <p>Ministerio de Juventud, Deportes y Cultura</p>
        <span>Provincia del Neuquén</span>
    </header>


    <section class="panel">

        <h2>Datos generales</h2>

        <div class="datos-grid">

            <div>
                <label>N° Orden de Compra</label>
                <input id="numeroOrden" type="text">
            </div>

            <div>
                <label>Fecha</label>
                <input id="fechaOrden" type="date">
            </div>

            <div>
                <label>Expediente</label>
                <input id="expediente" type="text">
            </div>

            <div>
                <label>Proveedor</label>
                <input id="proveedor" type="text">
            </div>

            <div>
                <label>CUIT</label>
                <input id="cuit" type="text">
            </div>

            <div>
                <label>Destino</label>
                <input id="destino" type="text">
            </div>

        </div>

    </section>


    <section class="panel">

        <div class="titulo-renglones">

            <div>
                <h2>Renglones</h2>
                <p>La orden comienza con un renglón y podés agregar todos los necesarios.</p>
            </div>

            <button id="btnAgregar" class="btn-agregar">
                + Agregar renglón
            </button>

        </div>

        <div id="listaRenglones"></div>

    </section>


    <section class="panel">

        <h2>Observaciones</h2>

        <textarea
            id="observaciones"
            rows="4"
            placeholder="Observaciones..."></textarea>

    </section>


    <div class="botones">

        <button id="btnVistaPrevia" class="btn-vista">
            👁 Vista previa
        </button>

        <button id="btnPDF" class="btn-pdf">
            📄 Descargar PDF
        </button>

    </div>


    <section id="zonaPreview" class="zona-preview">

        <h2>Vista previa</h2>

        <div id="documentoPDF"></div>

    </section>

</div>


<script src="script.js"></script>

</body>
</html>
